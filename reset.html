<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Восстановление приложения</title>
  <style>
    body { margin: 0; font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #F4F5EF; color: #1D2820; }
    main { max-width: 520px; margin: 0 auto; padding: 32px 20px; display: flex; flex-direction: column; gap: 16px; }
    h1 { font-size: 26px; margin: 0; }
    p { margin: 0; }
    .ok { color: #2F5A3A; font-weight: 700; }
    .err { color: #B3261E; }
    a.btn { display: block; text-align: center; padding: 14px; border-radius: 12px; background: #3E6B48; color: #fff; font-weight: 700; text-decoration: none; }
    ul { margin: 0; padding-left: 20px; }
  </style>
</head>
<body>
<main>
  <h1>Восстановление приложения</h1>
  <p>Эта страница удаляет только сохранённые файлы самого приложения, чтобы оно загрузилось заново. <b>Ваши фото, клумбы, растения и записи не затрагиваются.</b></p>
  <p id="status">Сбрасываю файлы приложения…</p>
  <ul id="log"></ul>
  <a class="btn" href="./" id="back" hidden>Открыть приложение</a>
</main>
<script>
  (async () => {
    const log = (t) => { const li = document.createElement('li'); li.textContent = t; document.getElementById('log').append(li); };
    try {
      if ('serviceWorker' in navigator) {
        const regs = await navigator.serviceWorker.getRegistrations();
        for (const r of regs) await r.unregister();
        log(`Отключено фоновых обработчиков: ${regs.length}`);
      }
      if ('caches' in window) {
        const keys = await caches.keys();
        for (const k of keys) await caches.delete(k);
        log(`Удалено наборов файлов: ${keys.length}`);
      }
      if (navigator.storage?.estimate) {
        const e = await navigator.storage.estimate();
        log(`Данные дневника на месте: занято ${(e.usage / 1024 / 1024).toFixed(1)} МБ`);
      }
      document.getElementById('status').className = 'ok';
      document.getElementById('status').textContent = 'Готово. Закройте все окна и вкладки с приложением, затем откройте его снова.';
    } catch (e) {
      document.getElementById('status').className = 'err';
      document.getElementById('status').textContent = `Не получилось: ${e.message}`;
    }
    document.getElementById('back').hidden = false;
  })();
</script>
</body>
</html>
